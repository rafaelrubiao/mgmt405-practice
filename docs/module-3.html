<style>
:root {
  --bg:#fafaf7; --fg:#1a1a1a; --muted:#666; --line:#dcd9d2; --card:#fff;
  --accent:#0066cc; --accent-soft:#e6f0fa; --good:#2a8a3e; --good-soft:#e7f5ea;
  --warn:#b85c00; --warn-soft:#fff7ea; --bad:#b03030; --bad-soft:#fdecec;
}
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
header { background:#1f3a5f; color:#fff; padding:14px 22px; }
header h1 { margin:0; font-size:18px; font-weight:600; }
header .sub { color:#cfdbe8; font-size:13px; margin-top:2px; }
.modnav { background:#fff; border-bottom:1px solid var(--line); padding:0 10px; display:flex; overflow-x:auto; }
.modnav a { padding:11px 14px; font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; border-bottom:3px solid transparent; white-space:nowrap; }
.modnav a:hover { color:var(--fg); background:#f5f3ec; }
.modnav a.active { color:var(--accent); border-bottom-color:var(--accent); }
.controls { background:#f0ede5; padding:8px 22px; display:flex; align-items:center; gap:14px; font-size:13px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.controls label { font-weight:600; }
.controls select { padding:4px 8px; font-size:13px; border:1px solid var(--line); border-radius:3px; background:#fff; }
.controls .stats { margin-left:auto; color:var(--muted); }
.controls .stats strong { color:var(--good); }
main { max-width:880px; margin:0 auto; padding:18px 22px 100px; }
.note { background:var(--accent-soft); color:var(--accent); border-left:3px solid var(--accent); padding:8px 12px; margin:0 0 14px; border-radius:0 4px 4px 0; font-size:13.5px; font-weight:600; }
.intro { color:var(--muted); font-size:14px; margin:4px 0 0; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; margin-top:18px; }
.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; text-decoration:none; color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,0.03); }
.card:hover { border-color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.08); }
.card .mlabel { color:var(--accent); font-weight:700; font-size:13px; }
.card .mtitle { font-weight:600; margin:4px 0 8px; font-size:15px; line-height:1.35; }
.card .mmeta { color:var(--muted); font-size:12.5px; }
.card .mprog { margin-top:8px; font-size:12.5px; color:var(--muted); }
.card .mprog.some { color:var(--good); font-weight:600; }
.q { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 22px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
.q.done.correct { border-left:4px solid var(--good); }
.q.done.failed  { border-left:4px solid var(--bad); }
.qhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.qid { font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--muted); font-size:12px; }
.qtag { display:inline-block; background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; }
.qtag.mcq { background:#f5e9ff; color:#6a2cb0; }
.qtag.open { background:#e6f0fa; color:#0066cc; }
.qtheme { color:var(--muted); font-size:13px; font-weight:600; }
.qstatus { margin-left:auto; font-size:12px; font-weight:600; }
.qstatus.correct { color:var(--good); }
.qstatus.failed  { color:var(--bad); }
.qstem { font-size:14.5px; margin:10px 0; white-space:pre-wrap; }
.qask  { font-size:14.5px; font-weight:600; margin:10px 0; }
.input-row { display:flex; gap:8px; align-items:center; margin:14px 0; flex-wrap:wrap; }
.input-row input[type=number] { padding:6px 10px; font-size:15px; border:1px solid var(--line); border-radius:4px; width:160px; }
.input-row input[type=number]:disabled { background:#f4f4f4; color:#999; }
.unit { color:var(--muted); font-size:14px; }
.choices label { display:block; padding:7px 10px; margin:3px 0; cursor:pointer; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:14px; }
.choices label:hover { background:#f5f3ec; }
.choices label.selected { background:var(--accent-soft); border-color:var(--accent); }
.choices input { margin-right:8px; }
button.action { padding:6px 14px; font-size:14px; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
button.action:hover { background:#0055aa; }
button.action.secondary { background:#fff; color:var(--accent); }
button.action.secondary:hover { background:var(--accent-soft); }
button.action:disabled { background:#aaa; border-color:#aaa; cursor:not-allowed; }
.feedback { margin:8px 0; padding:8px 12px; border-radius:4px; font-size:13.5px; font-weight:600; }
.feedback.correct { background:var(--good-soft); color:var(--good); border-left:3px solid var(--good); }
.feedback.wrong   { background:var(--bad-soft); color:var(--bad); border-left:3px solid var(--bad); }
.feedback.info    { background:var(--accent-soft); color:var(--accent); border-left:3px solid var(--accent); }
.feedback.result  { padding:14px 18px; font-size:15.5px; border-left-width:5px; display:flex; align-items:center; gap:12px; }
.feedback.result .icon { font-size:28px; line-height:1; font-weight:700; }
.feedback.result .sub  { font-weight:500; opacity:0.85; font-size:13.5px; margin-left:4px; }
.hint { background:var(--warn-soft); border-left:3px solid var(--warn); padding:8px 12px; margin:6px 0; border-radius:0 4px 4px 0; font-size:13.5px; }
.hint b { color:var(--warn); }
.solution { background:#f5f3ec; border-left:3px solid #888; padding:10px 14px; margin:8px 0; border-radius:0 4px 4px 0; }
.solution h4 { margin:0 0 6px; font-size:13px; color:#444; text-transform:uppercase; letter-spacing:0.04em; }
.solution pre { margin:0; white-space:pre-wrap; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.5; }
.attempts { color:var(--muted); font-size:12px; margin-left:8px; }
.calc-toggle { position:fixed; bottom:18px; right:18px; padding:10px 14px; background:var(--accent); color:#fff; border:none; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:90; }
.calc-toggle:hover { background:#0055aa; }
.calc { position:fixed; bottom:64px; right:18px; width:260px; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.18); padding:8px; display:none; z-index:90; }
.calc.show { display:block; }
.calc .display { background:#f5f3ec; border:1px solid var(--line); border-radius:4px; padding:10px 12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:18px; text-align:right; min-height:44px; word-break:break-all; overflow-wrap:anywhere; }
.calc .keys { display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; margin-top:6px; }
.calc .keys button { padding:9px 0; font-size:14px; font-weight:600; border:1px solid var(--line); background:#fff; cursor:pointer; border-radius:4px; }
.calc .keys button:hover { background:#f0ede5; }
.calc .keys button.op { background:var(--accent-soft); color:var(--accent); }
.calc .keys button.eq { background:var(--accent); color:#fff; grid-column:span 2; }
.calc .keys button.fn { background:#e9e6dd; color:#555; }
.calc .err { color:var(--bad); }
@media (max-width:640px) {
  main { padding:14px 14px 100px; }
  .calc { right:8px; left:8px; bottom:60px; width:auto; }
}
</style>

<script id="QDATA" type="application/json">{"module": {"key": "M3", "label": "Module 3", "title": "Production & Costs"}, "questions": [{"id": "m3-q1", "module": "M3", "theme": "Bang-for-Buck Rule", "format": "mcq", "stem": "A factory's marginal product of labor is MP_L = 45 units/hour at a wage of $15/hour. Its marginal product of capital is MP_K = 90 units/hour at a rental rate of $36/hour.", "ask": "To produce the same output at lower cost, the factory should:", "choices": ["Hire more labor, less capital", "Hire more capital, less labor", "Keep the current input mix (already cost-minimizing)", "Hire more of both", "Hire less of both"], "correct_index": 0, "hints": ["Cost-minimizing rule: MP_L / w = MP_K / p_K (equalize 'bang per buck').", "Compute the two ratios: MP_L/w = 45/15 = 3.0; MP_K/p_K = 90/36 = 2.5.", "Labor gives more output per dollar (3.0 > 2.5). Substitute toward labor: more L, less K. As L rises, MP_L falls (diminishing returns), and as K falls, MP_K rises — the ratios will equalize."], "solution": "Bang-for-buck ratios:\n  MP_L / w = 45 / $15 = 3.0 units per dollar\n  MP_K / p_K = 90 / $36 = 2.5 units per dollar\n\nLabor gives more output per dollar. To minimize cost at the same output, the factory should substitute toward LABOR — more L, less K. As L rises MP_L falls, and as K falls MP_K rises, until the two ratios equalize."}, {"id": "m3-q2", "module": "M3", "theme": "Average Total Cost", "format": "open", "stem": "A small print shop has the following total cost schedule (Q = books printed/day, TC in dollars):\n  Q=0: TC=1,500\n  Q=10: TC=2,100\n  Q=20: TC=2,500\n  Q=30: TC=3,000\n  Q=40: TC=3,800\n  Q=50: TC=5,000", "ask": "What is the average total cost (ATC) at Q = 40?", "answer": 95.0, "tolerance_abs": 0.05, "unit": "$", "hints": ["ATC = TC / Q. Read TC at Q=40 from the table.", "TC at Q=40 is $3,800.", "ATC = $3,800 / 40 = $95.00."], "solution": "ATC = TC / Q\n     = $3,800 / 40\n     = $95.00 per book\n\n(For comparison: AFC = $1,500/40 = $37.50; AVC = $2,300/40 = $57.50; ATC = $95.00. AFC + AVC = ATC ✓.)"}, {"id": "m3-q3", "module": "M3", "theme": "Marginal Cost from Quadratic TC", "format": "open", "stem": "A firm's total cost function is TC(Q) = 80 + 6Q + 0.25Q².", "ask": "What is the marginal cost at Q = 12 (in dollars)?", "answer": 12, "tolerance_abs": 0, "unit": "$", "hints": ["MC = dTC/dQ. Take the derivative of the cost function.", "TC = 80 + 6Q + 0.25Q² → MC(Q) = 6 + 0.5Q.", "At Q = 12: MC = 6 + 0.5(12) = 6 + 6 = $12."], "solution": "TC(Q) = 80 + 6Q + 0.25Q²\nMC(Q) = dTC/dQ = 6 + 0.5Q\n\nAt Q = 12:  MC = 6 + 0.5(12) = $12.\n\n(Note: the fixed cost $80 doesn't appear in MC — that's why FC never affects the profit-maximizing output level.)"}, {"id": "m3-q4", "module": "M3", "theme": "Shutdown Rule", "format": "open", "stem": "A small candle-maker operates in a perfectly competitive market. Its total cost is TC = 800 + 6Q + 0.2Q², and the market price is $18 per candle.", "ask": "Compute the firm's profit at the profit-maximizing quantity (in dollars; enter a negative number if it's a loss).", "answer": -620, "tolerance_abs": 1, "unit": "$", "hints": ["For a price-taker, profit-max is where P = MC. Find MC and solve.", "MC = 6 + 0.4Q. Set MC = 18: 0.4Q = 12 → Q* = 30.", "TR = $18 × 30 = $540. TC = 800 + 6(30) + 0.2(30²) = 800 + 180 + 180 = $1,160. Profit = 540 − 1,160 = −$620. Check AVC = 6 + 0.2Q = 6 + 6 = $12 at Q=30 → P=$18 > AVC=$12, so the firm SHOULD keep operating in the short run (losing $620 beats shutting down and losing the full fixed cost of $800)."], "solution": "Step 1 — Profit-max: P = MC.\n  MC = 6 + 0.4Q. Set = 18: Q* = 30.\nStep 2 — Compute revenue and cost:\n  TR = 18·30 = $540\n  TC = 800 + 6(30) + 0.2(30²) = 800 + 180 + 180 = $1,160\nStep 3 — Profit:\n  π = $540 − $1,160 = −$620\n\nShould the firm operate? Check AVC at Q=30: VC = 6(30) + 0.2(900) = 360, so AVC = $12. Since P=$18 > AVC=$12, the firm covers its variable costs and contributes toward the fixed $800. Operating: loss = $620. Shutting down: loss = $800. → OPERATE."}, {"id": "m3-q5", "module": "M3", "theme": "Marginal Cost of Equal-Pay Hire", "format": "open", "stem": "A custom furniture workshop employs 4 carpenters, each paid $180/day. To handle a backlog, the workshop wants to hire a 5th carpenter, who has agreed to join at $230/day. However, internal policy requires all carpenters to be paid the same wage.", "ask": "What is the marginal cost (per day) of hiring the 5th carpenter? (In dollars.)", "answer": 430, "tolerance_abs": 0, "unit": "$", "hints": ["If equal pay must hold, all 5 carpenters must be paid the new (higher) rate.", "Before: 4 × $180 = $720/day. After: 5 × $230 = $1,150/day.", "Marginal cost of the 5th carpenter = $1,150 − $720 = $430."], "solution": "Before hire: total wage bill = 4 × $180 = $720.\nAfter hire (everyone at $230): 5 × $230 = $1,150.\n\nMarginal cost = $1,150 − $720 = $430.\n\nThis is much more than the new carpenter's own salary of $230 — the extra $200 reflects the raise the workshop must give the existing 4 carpenters ($50 × 4). A classic example of how labor-market constraints raise the true marginal cost of hiring."}, {"id": "m3-mcq-2", "module": "M3", "theme": "Marginal Product from a Table", "format": "mcq", "stem": "A landscaping crew's output schedule:\n  3 workers → 18 lawns/day\n  4 workers → 24 lawns/day\n  5 workers → 28 lawns/day", "ask": "What is the marginal product of the 5th worker?", "choices": ["28 lawns/day", "24 lawns/day", "6 lawns/day", "4 lawns/day", "5.6 lawns/day"], "correct_index": 3, "hints": ["Marginal product of the n-th worker = additional output from adding that worker.", "MP_5 = Q(5 workers) − Q(4 workers).", "MP_5 = 28 − 24 = 4 lawns/day. (Notice MP_4 was 6, MP_5 is 4 — diminishing returns.)"], "solution": "MP_5 = Q(5) − Q(4) = 28 − 24 = 4 lawns/day.\n\nThe schedule shows diminishing marginal returns: MP_4 = 24 − 18 = 6, then MP_5 = 28 − 24 = 4. Each additional worker adds less than the previous one (crowding around the same equipment)."}, {"id": "m3-mcq-3", "module": "M3", "theme": "MP and AP Relationship", "format": "mcq", "stem": "A firm's current average product of labor is 12 units/worker. The next worker hired would add 18 units (marginal product = 18).", "ask": "What happens to average product after the hire?", "choices": ["AP rises", "AP falls", "AP stays the same", "AP doubles", "Cannot determine"], "correct_index": 0, "hints": ["AP = total output / number of workers. MP = output from one more worker.", "If the next worker adds MORE than the current average, the average is pulled UP.", "MP = 18 > AP = 12 → AP rises. (Same logic as test scores: a new score above your average raises the average.)"], "solution": "When MP > AP, the marginal pulls the average UP. With MP = 18 > AP = 12, the new worker is more productive than the average, so AP rises.\n\nGeneral rule:\n  MP > AP → AP rising\n  MP < AP → AP falling\n  MP = AP → AP at maximum"}, {"id": "m3-mcq-4", "module": "M3", "theme": "Bang-for-Buck Direction", "format": "mcq", "stem": "A firm finds that MP_L / wage = 8 (units per dollar of labor) and MP_K / rental = 5 (units per dollar of capital).", "ask": "To minimize cost at the SAME output level, the firm should:", "choices": ["Use more labor and less capital", "Use more capital and less labor", "Keep the same input mix (already cost-minimizing)", "Increase both inputs", "Decrease both inputs"], "correct_index": 0, "hints": ["Cost-minimizing rule: MP_L/w = MP_K/r (equalize bang-for-buck across inputs).", "Currently MP_L/w (=8) > MP_K/r (=5) — labor gives more output per dollar.", "Substitute TOWARD labor: more L (drives MP_L down by diminishing returns), less K (drives MP_K up). The ratios converge."], "solution": "Bang-for-buck rule: at the cost-min mix, MP_L/w = MP_K/r.\n\nCurrent: 8 > 5. Labor is more cost-effective per dollar. Substitute toward labor — more L (MP_L falls due to diminishing returns), less K (MP_K rises). Continue until the two ratios are equal."}, {"id": "m3-mcq-5", "module": "M3", "theme": "Fixed Cost and Marginal Cost", "format": "mcq", "stem": "A workshop's annual insurance premium rises from $1,500 to $2,500. Everything else (wages, material prices) is unchanged.", "ask": "What happens to the workshop's MARGINAL cost of producing each additional unit?", "choices": ["MC rises by $1,000/Q", "MC rises by $1,000", "MC is unchanged", "MC falls because ATC rises", "Cannot determine without knowing wages"], "correct_index": 2, "hints": ["MC = dTC/dQ. A fixed cost is independent of Q.", "The derivative of a fixed cost with respect to Q is 0.", "Higher FC raises AFC (and therefore ATC), but does NOT change MC."], "solution": "MC = dTC/dQ. Since the insurance premium doesn't depend on Q, its derivative is 0. So MC is UNCHANGED. The firm's profit-maximizing quantity is also unchanged (because the firm equates MR to MC). Only ATC rises (and profit falls by exactly the change in FC)."}, {"id": "m3-mcq-6", "module": "M3", "theme": "Cost Concept Identification", "format": "mcq", "stem": "A cloud-computing firm finds that doubling its server capacity causes total cost to rise by less than double — so its long-run AVERAGE cost falls.", "ask": "This pattern is called:", "choices": ["Diseconomies of scale", "Diminishing marginal returns", "Economies of scale", "Economies of scope", "Constant returns to scale"], "correct_index": 2, "hints": ["Economies of scale: long-run average cost falls as output rises.", "Distinct from diminishing returns (a short-run concept with one input fixed).", "Common in capital-intensive industries (cloud computing, semiconductors, telecom) with large fixed costs."], "solution": "Economies of scale = LR average cost falls as output rises. Typical of industries with high fixed costs spread over more units (cloud computing, semiconductors, software, pharma).\n\nDistinct from diminishing returns (SR, one input fixed) and from economies of SCOPE (joint production of multiple goods)."}, {"id": "m3-mcq-7", "module": "M3", "theme": "Cost Concept Identification", "format": "mcq", "stem": "A dairy finds that producing both milk AND cheese jointly costs LESS than producing each separately (the same herd, refrigeration, and distribution are shared across both products).", "ask": "This phenomenon is best described as:", "choices": ["Diminishing returns", "First-mover advantage", "Economies of scale", "Economies of scope", "Network effects"], "correct_index": 3, "hints": ["Scale = lower cost from PRODUCING MORE of ONE product.", "Scope = lower cost from PRODUCING TWO OR MORE products jointly (shared inputs/facilities).", "Two products jointly cheaper than separately → economies of scope."], "solution": "Economies of SCOPE: joint production of multiple products is cheaper than separate production, due to shared resources (here: the herd, refrigeration, distribution).\n\nContrast with economies of SCALE (lower cost per unit at larger production of ONE good)."}, {"id": "m3-mcq-8", "module": "M3", "theme": "PC Profit-Max Quantity (Numeric)", "format": "mcq", "stem": "A perfectly competitive firm has marginal cost MC = 3Q + 5. The market price is $35.", "ask": "What is the profit-maximizing quantity?", "choices": ["Q = 5", "Q = 8", "Q = 10", "Q = 12", "Q = 15"], "correct_index": 2, "hints": ["For a price-taker, profit max is where P = MC.", "Set 35 = 3Q + 5.", "Solve: 3Q = 30 → Q* = 10."], "solution": "Profit-max for a PC firm: P = MC.\n  35 = 3Q + 5\n  3Q = 30\n  Q* = 10."}, {"id": "m3-mcq-9", "module": "M3", "theme": "Shutdown Condition", "format": "mcq", "stem": "Under what condition should a perfectly competitive firm shut down in the SHORT RUN?", "ask": "The firm should shut down if and only if:", "choices": ["Price is below average total cost (P < ATC)", "Price is below marginal cost (P < MC)", "Price is below average VARIABLE cost (P < AVC)", "Total revenue is less than total cost (TR < TC)", "Profit is negative"], "correct_index": 2, "hints": ["The right comparison is P vs AVC, not P vs ATC.", "If P ≥ AVC, operating covers all variable cost + contributes something toward fixed cost — better than the FC loss from shutting down.", "Shut down only if P < AVC (operating loses MORE than just FC)."], "solution": "Shutdown rule: operate if P ≥ AVC; shut down if P < AVC.\n\nP < ATC means a loss, but operating may still be optimal if P ≥ AVC (you cover all VC and reduce the FC-only loss). Only when P < AVC is shutting down strictly better."}, {"id": "m3-mcq-10", "module": "M3", "theme": "Variable vs Fixed Cost Classification", "format": "mcq", "stem": "Consider a small full-service restaurant.", "ask": "Which of the following is a VARIABLE cost in the short run?", "choices": ["Monthly rent on the building", "Annual liquor license fee", "Salaried head chef's monthly pay", "Food ingredients used to prepare meals", "Property insurance premium (paid annually)"], "correct_index": 3, "hints": ["Variable costs CHANGE with output (Q). Fixed costs DON'T.", "Food ingredients scale directly with the number of meals served.", "Rent, licenses, salaried staff, and insurance are paid regardless of how many meals → fixed."], "solution": "Variable cost: depends on Q. Food ingredients scale directly with meals served. The others (rent, license, salaried pay, insurance) are paid the same regardless of output in the short run → fixed."}, {"id": "m3-mcq-11", "module": "M3", "theme": "SR vs LR Cost Relationship", "format": "mcq", "stem": "A firm chooses its capital level optimally for an expected output of Q* in the long run.", "ask": "How does its short-run ATC at Q* compare to its long-run ATC at Q*?", "choices": ["SR ATC at Q* equals LR ATC at Q* (they touch at this point)", "SR ATC at Q* is always strictly less than LR ATC at Q*", "SR ATC at Q* is always strictly greater than LR ATC at Q*", "SR ATC at Q* is unrelated to LR ATC", "SR ATC is always horizontal"], "correct_index": 0, "hints": ["LR ATC is the LOWER ENVELOPE of all the SR ATC curves (one SR curve per fixed capital level).", "At the Q where SR capital was chosen optimally, the SR and LR curves touch.", "Away from that Q, SR ATC > LR ATC (the firm is stuck with sub-optimal capital)."], "solution": "LR ATC is the lower envelope of all SR ATC curves. At each output where the firm chose its capital optimally, the SR ATC equals the LR ATC. Away from that Q, the SR curve lies ABOVE the LR curve."}]}</script>
<script>
const D = JSON.parse(document.getElementById('QDATA').textContent);
const QS = D.questions;

// ---- Per-question state, persisted in localStorage (shared across module pages) ----
const STATE_KEY = 'mgmt405_practice_v1';
let STATE = {};
try { STATE = JSON.parse(localStorage.getItem(STATE_KEY)) || {}; } catch (_) { STATE = {}; }
function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); } catch (_) {} }
function getQState(qid) {
  if (!STATE[qid]) STATE[qid] = {attempts:0, hints_shown:0, completed:false, last_answer_correct:false, mcq_choice:null, last_input:'', show_solution:false};
  if (STATE[qid].show_solution === undefined) STATE[qid].show_solution = false;
  return STATE[qid];
}

let typeFilter = 'all';

function escapeHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- Stats ----
function updateStats() {
  let attempted = 0, correct = 0, total = 0;
  for (const q of QS) {
    if (typeFilter !== 'all' && q.format !== typeFilter) continue;
    total++;
    const s = STATE[q.id];
    if (s && (s.completed || s.attempts > 0)) attempted++;
    if (s && s.last_answer_correct) correct++;
  }
  document.getElementById('progress').textContent = attempted + ' / ' + total + ' attempted';
  document.getElementById('correct').textContent = correct + ' correct';
}

// ---- Render questions ----
function renderQuestions() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const filtered = QS.filter(q => typeFilter === 'all' || q.format === typeFilter);
  if (filtered.length === 0) {
    main.innerHTML = '<p style="color:var(--muted)">No questions match the current filter.</p>';
    updateStats(); return;
  }
  for (const q of filtered) {
    main.appendChild(renderQuestion(q));
  }
  updateStats();
}

function renderQuestion(q) {
  const s = getQState(q.id);
  const card = document.createElement('div');
  card.className = 'q';
  if (s.completed) card.classList.add('done', s.last_answer_correct ? 'correct' : 'failed');

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML =
    '<span class="qtag ' + q.format + '">' + (q.format === 'open' ? 'OPEN' : 'MCQ') + '</span>' +
    '<span class="qtheme">' + escapeHTML(q.theme) + '</span>' +
    '<span class="qid">' + q.id + '</span>' +
    '<span class="qstatus ' + (s.completed ? (s.last_answer_correct ? 'correct' : 'failed') : '') + '">' +
      (s.completed ? (s.last_answer_correct ? '✓ Solved' : '✗ See solution') : '') +
    '</span>';
  card.appendChild(head);

  const stem = document.createElement('div');
  stem.className = 'qstem';
  stem.textContent = q.stem;
  card.appendChild(stem);

  const ask = document.createElement('div');
  ask.className = 'qask';
  ask.textContent = q.ask;
  card.appendChild(ask);

  // Input area
  const inputArea = document.createElement('div');
  if (q.format === 'open') {
    inputArea.className = 'input-row';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = 'any';
    inp.placeholder = 'Numeric answer';
    inp.value = s.last_input || '';
    if (s.completed) inp.disabled = true;
    inp.dataset.qid = q.id;
    inputArea.appendChild(inp);
    if (q.unit) {
      const u = document.createElement('span');
      u.className = 'unit';
      u.textContent = q.unit;
      inputArea.appendChild(u);
    }
    if (!s.completed) {
      const btn = document.createElement('button');
      btn.className = 'action';
      btn.textContent = 'Check answer';
      btn.dataset.qid = q.id;
      btn.dataset.action = 'submit-open';
      inputArea.appendChild(btn);
    } else if (s.last_answer_correct) {
      const btn = document.createElement('button');
      btn.className = 'action secondary';
      btn.textContent = s.show_solution ? 'Hide solution' : 'Show solution';
      btn.dataset.qid = q.id;
      btn.dataset.action = 'toggle-solution';
      inputArea.appendChild(btn);
    }
    if (!s.completed && s.attempts > 0) {
      const att = document.createElement('span');
      att.className = 'attempts';
      att.textContent = 'Attempts: ' + s.attempts + ' / 3';
      inputArea.appendChild(att);
    }
  } else {
    inputArea.className = 'choices';
    inputArea.dataset.qid = q.id;
    for (let i = 0; i < q.choices.length; i++) {
      const lbl = document.createElement('label');
      const selected = s.mcq_choice === i;
      if (selected) lbl.classList.add('selected');
      lbl.innerHTML = '<input type="radio" name="' + q.id + '" value="' + i + '"' + (selected ? ' checked' : '') + (s.completed ? ' disabled' : '') + '> ' +
                     '<strong>' + String.fromCharCode(65 + i) + ')</strong> ' + escapeHTML(q.choices[i]);
      inputArea.appendChild(lbl);
    }
    const row = document.createElement('div');
    row.style.marginTop = '8px';
    if (!s.completed) {
      const btn = document.createElement('button');
      btn.className = 'action';
      btn.textContent = 'Check answer';
      btn.dataset.qid = q.id;
      btn.dataset.action = 'submit-mcq';
      row.appendChild(btn);
    } else if (s.last_answer_correct) {
      const btn = document.createElement('button');
      btn.className = 'action secondary';
      btn.textContent = s.show_solution ? 'Hide solution' : 'Show solution';
      btn.dataset.qid = q.id;
      btn.dataset.action = 'toggle-solution';
      row.appendChild(btn);
    }
    if (!s.completed && s.attempts > 0) {
      const att = document.createElement('span');
      att.className = 'attempts';
      att.textContent = 'Attempts: ' + s.attempts + ' / 3';
      row.appendChild(att);
    }
    inputArea.appendChild(row);
  }
  card.appendChild(inputArea);

  // Feedback and hints
  const fb = document.createElement('div');
  fb.className = 'feedback-area';
  fb.dataset.qid = q.id;
  card.appendChild(fb);

  if (s.completed) {
    const resDiv = document.createElement('div');
    resDiv.className = 'feedback result ' + (s.last_answer_correct ? 'correct' : 'wrong');
    if (s.last_answer_correct) {
      const tag = s.hints_shown > 0 ? '(after ' + s.hints_shown + ' hint' + (s.hints_shown > 1 ? 's' : '') + ')' : '(first try)';
      resDiv.innerHTML = '<span class="icon">✓</span><span><strong>Correct!</strong> <span class="sub">' + tag + '</span></span>';
    } else {
      resDiv.innerHTML = '<span class="icon">✗</span><span><strong>Incorrect.</strong> <span class="sub">No attempts remaining — full solution shown below.</span></span>';
    }
    fb.appendChild(resDiv);
  } else if (s.attempts > 0) {
    const left = 3 - s.attempts;
    const tail = left >= 0 ? ' (' + Math.max(left, 0) + ' attempt' + (left === 1 ? '' : 's') + ' left)' : '';
    const wrongDiv = document.createElement('div');
    wrongDiv.className = 'feedback wrong';
    wrongDiv.innerHTML = '<strong>✗ Not quite — try again.</strong> Hint ' + s.hints_shown + ' revealed below.' + tail;
    fb.appendChild(wrongDiv);
  }
  if (s.hints_shown > 0) renderHints(fb, q, s.hints_shown);
  if (s.completed && (!s.last_answer_correct || s.show_solution)) renderSolution(fb, q);

  return card;
}

function renderHints(container, q, n_shown) {
  container.querySelectorAll('.hint').forEach(el => el.remove());
  for (let i = 0; i < n_shown && i < q.hints.length; i++) {
    const h = document.createElement('div');
    h.className = 'hint';
    h.innerHTML = '<b>Hint ' + (i+1) + ':</b> ' + escapeHTML(q.hints[i]);
    container.appendChild(h);
  }
}

function renderSolution(container, q) {
  if (container.querySelector('.solution')) return;
  const sol = document.createElement('div');
  sol.className = 'solution';
  sol.innerHTML = '<h4>Full solution</h4><pre>' + escapeHTML(q.solution) + '</pre>';
  container.appendChild(sol);
}

// ---- Answer checking ----
function checkOpen(q, value) {
  const userVal = parseFloat(value);
  if (isNaN(userVal)) return {ok:false, msg:'Please enter a numeric answer.'};
  const tol = q.tolerance_abs || 0;
  const correct = Math.abs(userVal - q.answer) <= tol;
  return {ok:correct, msg: correct ? 'Correct!' : 'Not quite — try again.'};
}

function checkMCQ(q, choiceIndex) {
  if (choiceIndex === null || choiceIndex === undefined) return {ok:false, msg:'Pick an option first.'};
  const correct = choiceIndex === q.correct_index;
  return {ok:correct, msg: correct ? 'Correct!' : 'Not quite — try again.'};
}

// ---- Submit handler ----
document.addEventListener('click', e => {
  if (e.target.dataset.action === 'submit-open' || e.target.dataset.action === 'submit-mcq') {
    handleSubmit(e.target);
  } else if (e.target.dataset.action === 'toggle-solution') {
    const qid = e.target.dataset.qid;
    const s = getQState(qid);
    s.show_solution = !s.show_solution;
    saveState();
    renderQuestions();
  }
});

function handleSubmit(btn) {
  const qid = btn.dataset.qid;
  const q = QS.find(x => x.id === qid);
  const s = getQState(qid);

  if (s.completed) return;

  let result;
  if (q.format === 'open') {
    const inp = btn.parentElement.querySelector('input[type=number]');
    s.last_input = inp.value;
    result = checkOpen(q, inp.value);
  } else {
    const sel = document.querySelector('.choices[data-qid="' + qid + '"] input[type=radio]:checked');
    const choiceIndex = sel ? parseInt(sel.value) : null;
    s.mcq_choice = choiceIndex;
    result = checkMCQ(q, choiceIndex);
  }

  if (result.ok) {
    s.attempts += 1;
    s.completed = true;
    s.last_answer_correct = true;
    s.show_solution = false;
    saveState();
    renderQuestions();
    return;
  }

  s.attempts += 1;
  if (s.attempts <= 3) {
    if (s.hints_shown < s.attempts) s.hints_shown = s.attempts;
  } else {
    s.completed = true;
    s.last_answer_correct = false;
    s.show_solution = true;
    s.hints_shown = q.hints.length;
  }
  saveState();
  renderQuestions();
}

// MCQ choice highlighting
document.addEventListener('change', e => {
  if (e.target.matches('.choices input[type=radio]')) {
    const parent = e.target.closest('.choices');
    parent.querySelectorAll('label').forEach(l => l.classList.remove('selected'));
    e.target.closest('label').classList.add('selected');
  }
});

// ---- Filters ----
document.getElementById('typefilter').addEventListener('change', e => {
  typeFilter = e.target.value;
  renderQuestions();
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Reset your progress on this module? This cannot be undone.')) return;
  for (const q of QS) delete STATE[q.id];
  saveState();
  renderQuestions();
});

// ---- Calculator ----
const calc = document.getElementById('calc');
const calcDisp = document.getElementById('calcdisp');
let calcExpr = '';
function calcUpdate() { calcDisp.textContent = calcExpr || '0'; calcDisp.classList.remove('err'); }
function calcEval() {
  if (!calcExpr) return;
  try {
    if (!/^[\d+\-*/().\s*]+$/.test(calcExpr.replace(/\*\*/g, ''))) throw 'bad';
    const v = Function('return (' + calcExpr + ')')();
    if (!isFinite(v)) throw 'overflow';
    calcExpr = String(+v.toFixed(10).replace(/\.?0+$/, ''));
    calcUpdate();
  } catch (e) { calcDisp.textContent = 'Error'; calcDisp.classList.add('err'); calcExpr = ''; }
}
document.getElementById('calctoggle').addEventListener('click', () => calc.classList.toggle('show'));
document.querySelectorAll('.calc .keys button').forEach(b => {
  b.addEventListener('click', () => {
    const k = b.dataset.key, a = b.dataset.act;
    if (a === 'clear') { calcExpr = ''; calcUpdate(); }
    else if (a === 'back') { calcExpr = calcExpr.slice(0, -1); calcUpdate(); }
    else if (a === 'eq') { calcEval(); }
    else if (a === 'sqrt') {
      try {
        const v = calcExpr ? Function('return (' + calcExpr + ')')() : 0;
        if (v < 0) throw 'neg';
        calcExpr = String(+Math.sqrt(v).toFixed(10).replace(/\.?0+$/, ''));
        calcUpdate();
      } catch (e) { calcDisp.textContent = 'Error'; calcDisp.classList.add('err'); calcExpr = ''; }
    }
    else if (k) { calcExpr += k; calcUpdate(); }
  });
});

// ---- Init ----
renderQuestions();
</script>
